<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 380" width="100%" height="100%" fill="none">
  <defs>
    <linearGradient id="termBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0c0c0e"/>
      <stop offset="100%" stop-color="#050507"/>
    </linearGradient>

    <linearGradient id="termBorder" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.25"/>
      <stop offset="50%" stop-color="#71717a" stop-opacity="0.15"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0.25"/>
    </linearGradient>

    <linearGradient id="whiteBar" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#71717a"/>
      <stop offset="100%" stop-color="#ffffff"/>
    </linearGradient>

    <filter id="termGlow" x="-10%" y="-10%" width="120%" height="120%">
      <feGaussianBlur stdDeviation="2" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <style>
    @keyframes cursorBlink {
      0%, 100% { opacity: 1; }
      50% { opacity: 0; }
    }

    @keyframes cpuPulse {
      0%, 100% { width: 110px; }
      50% { width: 140px; }
    }

    @keyframes ramPulse {
      0%, 100% { width: 115px; }
      50% { width: 90px; }
    }

    @keyframes lineFade {
      0% { opacity: 0.6; }
      50% { opacity: 1; }
      100% { opacity: 0.6; }
    }

    .term-code {
      font-family: 'Fira Code', 'JetBrains Mono', Consolas, Monaco, monospace;
      font-size: 13px;
      line-height: 1.6;
    }

    .cursor { animation: cursorBlink 0.9s infinite; }
    .cpu-bar { animation: cpuPulse 4s ease-in-out infinite; }
    .ram-bar { animation: ramPulse 5s ease-in-out infinite; }
    .telemetry-pulse { animation: lineFade 2.5s ease-in-out infinite; }
  </style>

  <!-- Terminal Window Outer Container -->
  <rect x="2" y="2" width="896" height="376" rx="12" fill="url(#termBg)" stroke="url(#termBorder)" stroke-width="1"/>

  <!-- Top Bar / Title Bar -->
  <path d="M 2 14 Q 2 2 14 2 L 886 2 Q 898 2 898 14 L 898 42 L 2 42 Z" fill="#141417" fill-opacity="0.95"/>
  <line x1="2" y1="42" x2="898" y2="42" stroke="#27272a" stroke-width="1"/>

  <!-- Window Controls -->
  <circle cx="24" cy="22" r="5" fill="#3f3f46"/>
  <circle cx="42" cy="22" r="5" fill="#52525b"/>
  <circle cx="60" cy="22" r="5" fill="#71717a"/>

  <!-- File Tab 1 (Active) -->
  <g transform="translate(85, 8)">
    <rect width="185" height="28" rx="6" fill="#202024" stroke="#ffffff" stroke-width="0.8" stroke-opacity="0.25"/>
    <text x="14" y="19" fill="#ffffff" font-family="'Fira Code', monospace" font-size="11" font-weight="600">⚡ abhijeet.config.ts</text>
  </g>

  <!-- File Tab 2 (Inactive) -->
  <g transform="translate(280, 8)">
    <rect width="150" height="28" rx="6" fill="#101012" opacity="0.6"/>
    <text x="14" y="19" fill="#71717a" font-family="'Fira Code', monospace" font-size="11">🤖 rag-pipeline.py</text>
  </g>

  <!-- Top Right Session Badge -->
  <g transform="translate(730, 11)">
    <text x="150" y="16" text-anchor="end" fill="#a1a1aa" font-family="'Fira Code', monospace" font-size="11" opacity="0.9">
      zsh - 80x24 • UTF-8
    </text>
  </g>

  <!-- Main Code Content Area -->
  <g transform="translate(32, 72)" class="term-code">
    <!-- Line 1 -->
    <text x="0" y="0">
      <tspan fill="#71717a">01 </tspan>
      <tspan fill="#e4e4e7" font-weight="bold">const</tspan>
      <tspan fill="#ffffff" font-weight="bold"> abhijeet</tspan>
      <tspan fill="#71717a">: </tspan>
      <tspan fill="#d4d4d8">FullStackArchitect</tspan>
      <tspan fill="#71717a"> = {</tspan>
    </text>

    <!-- Line 2 -->
    <text x="0" y="24">
      <tspan fill="#71717a">02 </tspan>
      <tspan fill="#a1a1aa">  name</tspan><tspan fill="#71717a">: </tspan>
      <tspan fill="#ffffff">"Abhijeet Nayak"</tspan><tspan fill="#71717a">,</tspan>
    </text>

    <!-- Line 3 -->
    <text x="0" y="48">
      <tspan fill="#71717a">03 </tspan>
      <tspan fill="#a1a1aa">  role</tspan><tspan fill="#71717a">: </tspan>
      <tspan fill="#e4e4e7">"Full-Stack Developer &amp; AI Systems Architect"</tspan><tspan fill="#71717a">,</tspan>
    </text>

    <!-- Line 4 -->
    <text x="0" y="72">
      <tspan fill="#71717a">04 </tspan>
      <tspan fill="#a1a1aa">  distributedProtocols</tspan><tspan fill="#71717a">: </tspan>
      <tspan fill="#e4e4e7">"High-Concurrency WebSockets &amp; Event Queues"</tspan><tspan fill="#71717a">,</tspan>
    </text>

    <!-- Line 5 -->
    <text x="0" y="96">
      <tspan fill="#71717a">05 </tspan>
      <tspan fill="#a1a1aa">  coreStack</tspan><tspan fill="#71717a">: [</tspan>
      <tspan fill="#ffffff">"Next.js"</tspan><tspan fill="#71717a">, </tspan>
      <tspan fill="#ffffff">"React"</tspan><tspan fill="#71717a">, </tspan>
      <tspan fill="#ffffff">"Node.js"</tspan><tspan fill="#71717a">, </tspan>
      <tspan fill="#ffffff">"TypeScript"</tspan><tspan fill="#71717a">, </tspan>
      <tspan fill="#ffffff">"PostgreSQL"</tspan><tspan fill="#71717a">, </tspan>
      <tspan fill="#ffffff">"Prisma"</tspan>
      <tspan fill="#71717a">],</tspan>
    </text>

    <!-- Line 6 -->
    <text x="0" y="120">
      <tspan fill="#71717a">06 </tspan>
      <tspan fill="#a1a1aa">  specialties</tspan><tspan fill="#71717a">: [</tspan>
      <tspan fill="#d4d4d8">"RAG AI Pipelines (Qdrant/Cohere)"</tspan><tspan fill="#71717a">, </tspan>
      <tspan fill="#d4d4d8">"Real-Time WebSockets (~16ms)"</tspan><tspan fill="#71717a">, </tspan>
      <tspan fill="#d4d4d8">"HMAC Payments"</tspan>
      <tspan fill="#71717a">],</tspan>
    </text>

    <!-- Line 7 -->
    <text x="0" y="144">
      <tspan fill="#71717a">07 </tspan>
      <tspan fill="#a1a1aa">  productionImpact</tspan><tspan fill="#71717a">: { </tspan>
      <tspan fill="#a1a1aa">loadTimeReduction</tspan><tspan fill="#71717a">: </tspan><tspan fill="#ffffff">"35%"</tspan><tspan fill="#71717a">, </tspan>
      <tspan fill="#a1a1aa">sessionBoost</tspan><tspan fill="#71717a">: </tspan><tspan fill="#ffffff">"20%"</tspan><tspan fill="#71717a">, </tspan>
      <tspan fill="#a1a1aa">dsaSolved</tspan><tspan fill="#71717a">: </tspan><tspan fill="#ffffff">"200+"</tspan>
      <tspan fill="#71717a"> },</tspan>
    </text>

    <!-- Line 8 -->
    <text x="0" y="168">
      <tspan fill="#71717a">08 </tspan>
      <tspan fill="#a1a1aa">  currentMission</tspan><tspan fill="#71717a">: </tspan>
      <tspan fill="#ffffff">"Building scalable AI platforms &amp; distributed software systems"</tspan>
    </text>

    <!-- Line 9 -->
    <text x="0" y="192">
      <tspan fill="#71717a">09 </tspan>
      <tspan fill="#71717a">};</tspan>
    </text>

    <!-- Line 10 (Interactive Prompt Line) -->
    <text x="0" y="222">
      <tspan fill="#71717a">10 </tspan>
      <tspan fill="#ffffff" font-weight="bold">abhi@macbook-pro</tspan>
      <tspan fill="#71717a">:</tspan>
      <tspan fill="#d4d4d8">~/distributed</tspan>
      <tspan fill="#71717a">$ </tspan>
      <tspan fill="#ffffff">ship_code --scale --instant</tspan>
      <tspan class="cursor" fill="#ffffff" font-weight="bold"> ▋</tspan>
    </text>
  </g>

  <!-- Right Telemetry Sidebar Divider -->
  <line x1="660" y1="52" x2="660" y2="360" stroke="#27272a" stroke-width="1"/>

  <!-- Telemetry HUD in Sidebar -->
  <g transform="translate(680, 72)">
    <text x="0" y="0" fill="#ffffff" font-family="'Fira Code', monospace" font-size="11" font-weight="bold" letter-spacing="1">⚡ SYS TELEMETRY</text>

    <!-- CPU Usage Meter -->
    <g transform="translate(0, 20)">
      <text x="0" y="0" fill="#a1a1aa" font-family="'Segoe UI', sans-serif" font-size="11">CPU CORE LOAD</text>
      <text x="180" y="0" text-anchor="end" fill="#ffffff" font-family="'Fira Code', monospace" font-size="11">78.4%</text>
      <rect x="0" y="8" width="180" height="6" rx="3" fill="#18181b"/>
      <rect class="cpu-bar" x="0" y="8" width="125" height="6" rx="3" fill="url(#whiteBar)"/>
    </g>

    <!-- Memory Meter -->
    <g transform="translate(0, 60)">
      <text x="0" y="0" fill="#a1a1aa" font-family="'Segoe UI', sans-serif" font-size="11">RAM UTILIZATION</text>
      <text x="180" y="0" text-anchor="end" fill="#ffffff" font-family="'Fira Code', monospace" font-size="11">4.2 / 16 GB</text>
      <rect x="0" y="8" width="180" height="6" rx="3" fill="#18181b"/>
      <rect class="ram-bar" x="0" y="8" width="105" height="6" rx="3" fill="url(#whiteBar)"/>
    </g>

    <!-- WebSocket Latency -->
    <g transform="translate(0, 100)" class="telemetry-pulse">
      <text x="0" y="0" fill="#a1a1aa" font-family="'Segoe UI', sans-serif" font-size="11">WS LATENCY</text>
      <text x="180" y="0" text-anchor="end" fill="#ffffff" font-family="'Fira Code', monospace" font-size="11">⚡ 16 ms</text>
      <rect x="0" y="8" width="180" height="6" rx="3" fill="#18181b"/>
      <rect x="0" y="8" width="165" height="6" rx="3" fill="#ffffff"/>
    </g>

    <!-- Status Box -->
    <g transform="translate(0, 138)">
      <rect width="180" height="42" rx="6" fill="#141417" stroke="#ffffff" stroke-width="0.8" stroke-opacity="0.25"/>
      <circle cx="15" cy="21" r="3.5" fill="#ffffff" filter="url(#termGlow)"/>
      <text x="28" y="18" fill="#ffffff" font-family="'Segoe UI', sans-serif" font-size="10" font-weight="700">STATUS: ACTIVE</text>
      <text x="28" y="32" fill="#a1a1aa" font-family="'Segoe UI', sans-serif" font-size="9">OPEN TO SDE ROLES</text>
    </g>
  </g>
</svg>