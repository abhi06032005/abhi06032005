<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 320" width="100%" height="100%" fill="none">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#070714"/>
      <stop offset="50%" stop-color="#0d0b26"/>
      <stop offset="100%" stop-color="#050510"/>
    </linearGradient>

    <!-- Neon Cyan Gradient -->
    <linearGradient id="cyanGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00f0ff"/>
      <stop offset="50%" stop-color="#7000ff"/>
      <stop offset="100%" stop-color="#ff007f"/>
    </linearGradient>

    <!-- Glowing Text Gradient -->
    <linearGradient id="textGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="50%" stop-color="#c084fc"/>
      <stop offset="100%" stop-color="#f472b6"/>
    </linearGradient>

    <!-- Laser Gradient -->
    <linearGradient id="laserGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="transparent"/>
      <stop offset="50%" stop-color="#00f0ff"/>
      <stop offset="100%" stop-color="transparent"/>
    </linearGradient>

    <!-- Cyber Grid Pattern -->
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#00f0ff" stroke-width="0.75" stroke-opacity="0.08"/>
    </pattern>

    <!-- Glow Filters -->
    <filter id="glow-cyan" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="4" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <filter id="glow-strong" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="8" result="blur1"/>
      <feGaussianBlur stdDeviation="3" result="blur2"/>
      <feMerge>
        <feMergeNode in="blur1"/>
        <feMergeNode in="blur2"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <style>
    /* CSS ANIMATIONS */
    @keyframes scanline {
      0% { transform: translateY(-50px); opacity: 0; }
      30% { opacity: 0.8; }
      70% { opacity: 0.8; }
      100% { transform: translateY(340px); opacity: 0; }
    }

    @keyframes pulseGlow {
      0%, 100% { opacity: 0.3; transform: scale(1); }
      50% { opacity: 0.7; transform: scale(1.03); }
    }

    @keyframes glitch {
      0%, 92%, 100% { transform: translate(0, 0); }
      93% { transform: translate(-2px, 1px); }
      95% { transform: translate(2px, -1px); filter: hue-rotate(90deg); }
      97% { transform: translate(-1px, -1px); }
    }

    @keyframes floatParticle {
      0%, 100% { transform: translateY(0px) scale(0.8); opacity: 0.2; }
      50% { transform: translateY(-18px) scale(1.3); opacity: 0.9; }
    }

    @keyframes blinkDot {
      0%, 100% { opacity: 1; filter: drop-shadow(0 0 6px #00ff88); }
      50% { opacity: 0.2; filter: none; }
    }

    @keyframes beamMove {
      0% { stroke-dashoffset: 600; }
      100% { stroke-dashoffset: 0; }
    }

    @keyframes eqBar {
      0%, 100% { height: 6px; y: 284px; }
      50% { height: 26px; y: 264px; }
    }

    @keyframes rotateReticle {
      from { transform: rotate(0deg); }
      to { transform: rotate(360deg); }
    }

    .bg-rect { fill: url(#bgGrad); }
    .grid-bg { fill: url(#grid); }
    .scan-beam { animation: scanline 4.5s ease-in-out infinite; }
    .title-glow { font-family: 'Segoe UI', -apple-system, BlinkMacSystemFont, Roboto, sans-serif; font-weight: 900; animation: glitch 6s infinite; }
    .dot-live { animation: blinkDot 1.4s ease-in-out infinite; }
    .reticle { transform-origin: 840px 65px; animation: rotateReticle 16s linear infinite; }
    .p1 { animation: floatParticle 3.2s ease-in-out infinite; }
    .p2 { animation: floatParticle 4.5s ease-in-out infinite 1s; }
    .p3 { animation: floatParticle 3.8s ease-in-out infinite 2s; }
    .p4 { animation: floatParticle 5.1s ease-in-out infinite 0.5s; }
    .p5 { animation: floatParticle 4.1s ease-in-out infinite 1.7s; }

    .eq1 { animation: eqBar 1.2s ease-in-out infinite; }
    .eq2 { animation: eqBar 0.8s ease-in-out infinite 0.2s; }
    .eq3 { animation: eqBar 1.5s ease-in-out infinite 0.5s; }
    .eq4 { animation: eqBar 0.9s ease-in-out infinite 0.1s; }
    .eq5 { animation: eqBar 1.3s ease-in-out infinite 0.4s; }
    .eq6 { animation: eqBar 1.1s ease-in-out infinite 0.3s; }
    .eq7 { animation: eqBar 0.7s ease-in-out infinite 0.6s; }
    .eq8 { animation: eqBar 1.4s ease-in-out infinite 0.2s; }
  </style>

  <!-- Background Base -->
  <rect width="920" height="320" rx="16" class="bg-rect"/>
  
  <!-- Cyber Grid Pattern Overlay -->
  <rect width="920" height="320" rx="16" class="grid-bg"/>

  <!-- Top Ambient Glow Orbs -->
  <circle cx="200" cy="40" r="140" fill="#00f0ff" opacity="0.08" filter="url(#glow-strong)"/>
  <circle cx="720" cy="180" r="160" fill="#7000ff" opacity="0.1" filter="url(#glow-strong)"/>
  <circle cx="460" cy="280" r="120" fill="#ff007f" opacity="0.07" filter="url(#glow-strong)"/>

  <!-- Scanning Laser Beam -->
  <rect class="scan-beam" x="0" y="0" width="920" height="3" fill="url(#laserGrad)"/>

  <!-- Outer Cyber Border with Neon Accents -->
  <rect x="2" y="2" width="916" height="316" rx="15" fill="none" stroke="#00f0ff" stroke-width="1.5" stroke-opacity="0.35"/>
  <rect x="6" y="6" width="908" height="308" rx="12" fill="none" stroke="#7000ff" stroke-width="0.75" stroke-opacity="0.3"/>

  <!-- Corner Tech Brackets -->
  <path d="M 4 28 L 4 10 L 28 10" fill="none" stroke="#00f0ff" stroke-width="3" filter="url(#glow-cyan)"/>
  <path d="M 916 28 L 916 10 L 892 10" fill="none" stroke="#00f0ff" stroke-width="3" filter="url(#glow-cyan)"/>
  <path d="M 4 292 L 4 310 L 28 310" fill="none" stroke="#00f0ff" stroke-width="3" filter="url(#glow-cyan)"/>
  <path d="M 916 292 L 916 310 L 892 310" fill="none" stroke="#00f0ff" stroke-width="3" filter="url(#glow-cyan)"/>

  <!-- Rotating Radar / Reticle Element Top Right -->
  <g class="reticle">
    <circle cx="840" cy="65" r="32" fill="none" stroke="#00f0ff" stroke-width="1" stroke-dasharray="8 6" opacity="0.4"/>
    <circle cx="840" cy="65" r="22" fill="none" stroke="#7000ff" stroke-width="1" stroke-dasharray="4 4" opacity="0.6"/>
    <line x1="840" y1="28" x2="840" y2="102" stroke="#00f0ff" stroke-width="0.8" opacity="0.3"/>
    <line x1="803" y1="65" x2="877" y2="65" stroke="#00f0ff" stroke-width="0.8" opacity="0.3"/>
    <circle cx="840" cy="65" r="3" fill="#00f0ff" opacity="0.8"/>
  </g>
  <text x="840" y="112" text-anchor="middle" fill="#00f0ff" font-family="'Courier New', monospace" font-size="9" letter-spacing="1.5" opacity="0.6">SYS:LOCK</text>

  <!-- Twinkling / Floating Particle Field -->
  <circle class="p1" cx="120" cy="70" r="2" fill="#00f0ff"/>
  <circle class="p2" cx="280" cy="50" r="2.5" fill="#c084fc"/>
  <circle class="p3" cx="620" cy="80" r="1.8" fill="#f472b6"/>
  <circle class="p4" cx="780" cy="160" r="2.2" fill="#38bdf8"/>
  <circle class="p5" cx="160" cy="220" r="2" fill="#34d399"/>
  <circle class="p2" cx="390" cy="260" r="1.5" fill="#a78bfa"/>
  <circle class="p4" cx="720" cy="240" r="2.5" fill="#00f0ff"/>

  <!-- Circuit Trace Lines with Glowing Pulse -->
  <path d="M 30 160 L 90 160 L 120 190 L 170 190" fill="none" stroke="#00f0ff" stroke-width="1" stroke-opacity="0.35"/>
  <circle cx="170" cy="190" r="3" fill="#00f0ff" opacity="0.8"/>
  <path d="M 890 200 L 830 200 L 800 170 L 760 170" fill="none" stroke="#ff007f" stroke-width="1" stroke-opacity="0.35"/>
  <circle cx="760" cy="170" r="3" fill="#ff007f" opacity="0.8"/>

  <!-- Top System Badge Pill -->
  <g transform="translate(48, 38)">
    <rect x="0" y="0" width="280" height="26" rx="13" fill="#0c1024" stroke="#00f0ff" stroke-width="1" stroke-opacity="0.5"/>
    <circle class="dot-live" cx="16" cy="13" r="4.5" fill="#00ff88"/>
    <text x="30" y="17" fill="#00f0ff" font-family="'Segoe UI', -apple-system, sans-serif" font-weight="700" font-size="11" letter-spacing="1.2">SYSTEM ONLINE // FULL-STACK ARCHITECT</text>
  </g>

  <!-- Location Badge Pill -->
  <g transform="translate(338, 38)">
    <rect x="0" y="0" width="130" height="26" rx="13" fill="#0c1024" stroke="#7000ff" stroke-width="1" stroke-opacity="0.5"/>
    <text x="14" y="17" fill="#c084fc" font-family="'Segoe UI', -apple-system, sans-serif" font-weight="600" font-size="11" letter-spacing="1">🇮🇳 IN • PROD READY</text>
  </g>

  <!-- Main Hero Title: ABHIJEET NAYAK -->
  <g transform="translate(48, 132)">
    <!-- Shadow for Depth -->
    <text x="2" y="2" fill="#ff007f" opacity="0.3" class="title-glow" font-size="52" letter-spacing="3">ABHIJEET NAYAK</text>
    <!-- Glowing Main Text -->
    <text x="0" y="0" fill="url(#cyanGrad)" filter="url(#glow-strong)" class="title-glow" font-size="52" letter-spacing="3">ABHIJEET NAYAK</text>
  </g>

  <!-- Subtitle Tagline with High-Tech Terminal Prefix -->
  <g transform="translate(50, 168)">
    <text x="0" y="0" fill="#38bdf8" font-family="'Fira Code', 'Courier New', monospace" font-size="14" font-weight="600" letter-spacing="0.5">
      <tspan fill="#ec4899">&gt; </tspan>FULL-STACK ENGINEER <tspan fill="#64748b">|</tspan> NEXT.JS <tspan fill="#64748b">•</tspan> NODE.JS <tspan fill="#64748b">•</tspan> AI/RAG SYSTEMS <tspan fill="#64748b">•</tspan> DISTRIBUTED APPS
    </text>
  </g>

  <!-- Interactive Badges / Metrics Row -->
  <g transform="translate(50, 202)">
    <!-- Badge 1: BCA 8.9 CGPA -->
    <g transform="translate(0, 0)">
      <rect width="140" height="34" rx="8" fill="#0e1329" stroke="#38bdf8" stroke-width="1" stroke-opacity="0.4"/>
      <text x="14" y="21" fill="#38bdf8" font-family="'Segoe UI', sans-serif" font-size="12" font-weight="700">🎓 BCA • 8.9 CGPA</text>
    </g>

    <!-- Badge 2: Hackfest Top 50 -->
    <g transform="translate(150, 0)">
      <rect width="210" height="34" rx="8" fill="#130e29" stroke="#c084fc" stroke-width="1" stroke-opacity="0.4"/>
      <text x="14" y="21" fill="#c084fc" font-family="'Segoe UI', sans-serif" font-size="12" font-weight="700">🏆 Top 50 / 1100+ Hackfest</text>
    </g>

    <!-- Badge 3: 4x Production Apps -->
    <g transform="translate(370, 0)">
      <rect width="180" height="34" rx="8" fill="#1b0c20" stroke="#f472b6" stroke-width="1" stroke-opacity="0.4"/>
      <text x="14" y="21" fill="#f472b6" font-family="'Segoe UI', sans-serif" font-size="12" font-weight="700">⚡ 4x Full-Stack Shipped</text>
    </g>

    <!-- Badge 4: Live Optimization -->
    <g transform="translate(560, 0)">
      <rect width="190" height="34" rx="8" fill="#091b1a" stroke="#34d399" stroke-width="1" stroke-opacity="0.4"/>
      <text x="14" y="21" fill="#34d399" font-family="'Segoe UI', sans-serif" font-size="12" font-weight="700">🚀 ~35% Speed Optimized</text>
    </g>
  </g>

  <!-- Bottom Equalizer & Audio Signal Wave -->
  <g transform="translate(50, 0)">
    <text x="0" y="286" fill="#64748b" font-family="'Courier New', monospace" font-size="10" letter-spacing="1">AUDIO FLUX // 44.1kHz</text>
    <g transform="translate(140, 0)">
      <rect class="eq1" x="0" y="278" width="4" height="12" rx="2" fill="#00f0ff"/>
      <rect class="eq2" x="7" y="274" width="4" height="16" rx="2" fill="#38bdf8"/>
      <rect class="eq3" x="14" y="270" width="4" height="20" rx="2" fill="#818cf8"/>
      <rect class="eq4" x="21" y="276" width="4" height="14" rx="2" fill="#c084fc"/>
      <rect class="eq5" x="28" y="268" width="4" height="22" rx="2" fill="#e879f9"/>
      <rect class="eq6" x="35" y="272" width="4" height="18" rx="2" fill="#f472b6"/>
      <rect class="eq7" x="42" y="277" width="4" height="13" rx="2" fill="#fb7185"/>
      <rect class="eq8" x="49" y="271" width="4" height="19" rx="2" fill="#00f0ff"/>
    </g>
  </g>

  <!-- Bottom Right Decorative Terminal Coordinates -->
  <g transform="translate(710, 286)">
    <text x="150" y="0" text-anchor="end" fill="#00f0ff" font-family="'Courier New', monospace" font-size="10" opacity="0.6" letter-spacing="1">
      LAT: 16ms | CORE: STABLE | v3.4.0
    </text>
  </g>
</svg>
