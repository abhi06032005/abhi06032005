<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 300" width="100%" height="100%" fill="none">
  <defs>
    <!-- Background Dark Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#09090b"/>
      <stop offset="50%" stop-color="#040405"/>
      <stop offset="100%" stop-color="#000000"/>
    </linearGradient>

    <!-- Monochrome Line Gradients -->
    <linearGradient id="whiteGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#52525b"/>
      <stop offset="50%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#52525b"/>
    </linearGradient>

    <linearGradient id="textGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="70%" stop-color="#f4f4f5"/>
      <stop offset="100%" stop-color="#a1a1aa"/>
    </linearGradient>

    <!-- Globe Sphere Shading -->
    <radialGradient id="sphereShade" cx="35%" cy="35%" r="65%">
      <stop offset="0%" stop-color="#27272a" stop-opacity="0.5"/>
      <stop offset="60%" stop-color="#0d0d0f" stop-opacity="0.85"/>
      <stop offset="100%" stop-color="#000000" stop-opacity="0.98"/>
    </radialGradient>

    <radialGradient id="globeAtmosphere" cx="50%" cy="50%" r="50%">
      <stop offset="70%" stop-color="#ffffff" stop-opacity="0"/>
      <stop offset="96%" stop-color="#ffffff" stop-opacity="0.18"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0.4"/>
    </radialGradient>

    <!-- High-Pass Glow Filter -->
    <filter id="whiteGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <filter id="softGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <!-- Background Tech Grid Pattern -->
    <pattern id="monoGrid" width="30" height="30" patternUnits="userSpaceOnUse">
      <path d="M 30 0 L 0 0 0 30" fill="none" stroke="#ffffff" stroke-width="0.5" stroke-opacity="0.04"/>
    </pattern>
  </defs>

  <style>
    /* CSS ANIMATIONS FOR ROTATING GLOBE & NETWORK */
    @keyframes spinClockwise {
      from { transform: rotate(0deg); }
      to { transform: rotate(360deg); }
    }

    @keyframes spinCounter {
      from { transform: rotate(360deg); }
      to { transform: rotate(0deg); }
    }

    @keyframes pulsePing {
      0% { r: 2px; opacity: 0.9; stroke-width: 1.5; }
      70% { r: 24px; opacity: 0.2; stroke-width: 0.8; }
      100% { r: 32px; opacity: 0; stroke-width: 0; }
    }

    @keyframes bouncePacket1 {
      0% { stroke-dashoffset: 240; }
      100% { stroke-dashoffset: 0; }
    }

    @keyframes bouncePacket2 {
      0% { stroke-dashoffset: 0; }
      100% { stroke-dashoffset: 240; }
    }

    @keyframes nodeBlink {
      0%, 100% { opacity: 0.3; transform: scale(0.85); }
      50% { opacity: 1; transform: scale(1.25); filter: drop-shadow(0 0 4px #ffffff); }
    }

    @keyframes floatStar {
      0%, 100% { opacity: 0.2; transform: translateY(0px); }
      50% { opacity: 0.8; transform: translateY(-4px); }
    }

    .orbit-1 { transform-origin: 710px 150px; animation: spinClockwise 18s linear infinite; }
    .orbit-2 { transform-origin: 710px 150px; animation: spinCounter 24s linear infinite; }
    .orbit-3 { transform-origin: 710px 150px; animation: spinClockwise 32s linear infinite; }
    .globe-rotator { transform-origin: 710px 150px; animation: spinClockwise 45s linear infinite; }

    .ping-1 { animation: pulsePing 2.8s cubic-bezier(0, 0.2, 0.8, 1) infinite; }
    .ping-2 { animation: pulsePing 2.8s cubic-bezier(0, 0.2, 0.8, 1) infinite 1.4s; }
    .ping-3 { animation: pulsePing 3.2s cubic-bezier(0, 0.2, 0.8, 1) infinite 0.7s; }

    .packet-1 { stroke-dasharray: 20 180; animation: bouncePacket1 2.2s linear infinite; }
    .packet-2 { stroke-dasharray: 25 200; animation: bouncePacket2 2.6s linear infinite 0.4s; }
    .packet-3 { stroke-dasharray: 15 160; animation: bouncePacket1 1.8s linear infinite 0.9s; }
    .packet-4 { stroke-dasharray: 22 190; animation: bouncePacket2 2.4s linear infinite 1.2s; }

    .blink-fast { animation: nodeBlink 1.5s ease-in-out infinite; }
    .blink-med { animation: nodeBlink 2.4s ease-in-out infinite 0.6s; }
    .blink-slow { animation: nodeBlink 3.2s ease-in-out infinite 1.2s; }

    .star-1 { animation: floatStar 3s ease-in-out infinite; }
    .star-2 { animation: floatStar 4s ease-in-out infinite 1s; }
  </style>

  <!-- Outer Container with Subtle Dark Fill -->
  <rect width="920" height="300" rx="14" fill="url(#bgGrad)"/>
  <rect width="920" height="300" rx="14" fill="url(#monoGrid)"/>

  <!-- Minimalist Clean Hairline Borders -->
  <rect x="1" y="1" width="918" height="298" rx="13" fill="none" stroke="#ffffff" stroke-width="1" stroke-opacity="0.15"/>
  <rect x="5" y="5" width="910" height="290" rx="10" fill="none" stroke="#ffffff" stroke-width="0.5" stroke-opacity="0.06"/>

  <!-- Subtle Corner Brackets -->
  <path d="M 3 24 L 3 8 L 24 8" fill="none" stroke="#ffffff" stroke-width="2" stroke-opacity="0.7"/>
  <path d="M 917 24 L 917 8 L 896 8" fill="none" stroke="#ffffff" stroke-width="2" stroke-opacity="0.7"/>
  <path d="M 3 276 L 3 292 L 24 292" fill="none" stroke="#ffffff" stroke-width="2" stroke-opacity="0.7"/>
  <path d="M 917 276 L 917 292 L 896 292" fill="none" stroke="#ffffff" stroke-width="2" stroke-opacity="0.7"/>

  <!-- ==================== LEFT SECTION: BRAND & TYPOGRAPHY ==================== -->
  <g transform="translate(50, 42)">
    <!-- Status Pill -->
    <g transform="translate(0, 0)">
      <rect x="0" y="0" width="250" height="24" rx="12" fill="#18181b" stroke="#ffffff" stroke-width="1" stroke-opacity="0.2"/>
      <circle cx="14" cy="12" r="3.5" fill="#ffffff" filter="url(#whiteGlow)" class="blink-fast"/>
      <text x="26" y="16" fill="#e4e4e7" font-family="'Segoe UI', -apple-system, sans-serif" font-size="10" font-weight="700" letter-spacing="1.5">GLOBAL NETWORK // ONLINE</text>
    </g>

    <!-- Main Name Title -->
    <g transform="translate(0, 58)">
      <text x="0" y="0" fill="url(#textGrad)" font-family="'Segoe UI', -apple-system, BlinkMacSystemFont, 'Inter', sans-serif" font-size="46" font-weight="900" letter-spacing="3.5">ABHIJEET NAYAK</text>
    </g>

    <!-- High-Contrast Subtitle -->
    <g transform="translate(2, 88)">
      <text x="0" y="0" fill="#d4d4d8" font-family="'Fira Code', 'Courier New', monospace" font-size="13" font-weight="600" letter-spacing="1">
        <tspan fill="#ffffff" font-weight="800">&gt; </tspan>FULL-STACK DEVELOPER <tspan fill="#52525b">|</tspan> AI SYSTEMS ARCHITECT
      </text>
    </g>

    <!-- Clean Description Tagline -->
    <g transform="translate(2, 116)">
      <text x="0" y="0" fill="#a1a1aa" font-family="'Segoe UI', -apple-system, sans-serif" font-size="12.5" font-weight="400" letter-spacing="0.3">
        Architecting resilient distributed platforms, real-time protocols &amp; RAG pipelines.
      </text>
    </g>

    <!-- Monochrome Tech Pillars / Spec Pills -->
    <g transform="translate(0, 146)">
      <!-- Pill 1 -->
      <g transform="translate(0, 0)">
        <rect width="112" height="28" rx="6" fill="#141417" stroke="#ffffff" stroke-width="1" stroke-opacity="0.18"/>
        <text x="12" y="18" fill="#e4e4e7" font-family="'Segoe UI', sans-serif" font-size="11" font-weight="600">⚡ Distributed</text>
      </g>
      <!-- Pill 2 -->
      <g transform="translate(120, 0)">
        <rect width="124" height="28" rx="6" fill="#141417" stroke="#ffffff" stroke-width="1" stroke-opacity="0.18"/>
        <text x="12" y="18" fill="#e4e4e7" font-family="'Segoe UI', sans-serif" font-size="11" font-weight="600">🌐 WebSockets</text>
      </g>
      <!-- Pill 3 -->
      <g transform="translate(252, 0)">
        <rect width="118" height="28" rx="6" fill="#141417" stroke="#ffffff" stroke-width="1" stroke-opacity="0.18"/>
        <text x="12" y="18" fill="#e4e4e7" font-family="'Segoe UI', sans-serif" font-size="11" font-weight="600">🤖 AI / RAG</text>
      </g>
      <!-- Pill 4 -->
      <g transform="translate(378, 0)">
        <rect width="116" height="28" rx="6" fill="#141417" stroke="#ffffff" stroke-width="1" stroke-opacity="0.18"/>
        <text x="12" y="18" fill="#e4e4e7" font-family="'Segoe UI', sans-serif" font-size="11" font-weight="600">🔒 Full-Stack</text>
      </g>
    </g>

    <!-- Bottom Telemetry Metric -->
    <g transform="translate(2, 206)">
      <text x="0" y="0" fill="#71717a" font-family="'Fira Code', monospace" font-size="10" letter-spacing="1.2">
        LATENCY: ~16ms // PROTOCOL: TCP/WSS // LOC: 20.5937°N, 78.9629°E
      </text>
    </g>
  </g>

  <!-- ==================== RIGHT SECTION: ROTATING GLOBE & BOUNCING NETWORKS ==================== -->
  <g id="globeNetworkContainer">
    <!-- Globe Center = (710, 150), Radius = 92 -->

    <!-- Ambient Outer Sphere Atmosphere Glow -->
    <circle cx="710" cy="150" r="94" fill="url(#globeAtmosphere)"/>
    <circle cx="710" cy="150" r="92" fill="url(#sphereShade)"/>

    <!-- Subtle Background Constellation Nodes -->
    <g class="star-1">
      <circle cx="575" cy="65" r="1.5" fill="#ffffff" opacity="0.4"/>
      <circle cx="595" cy="225" r="1.5" fill="#ffffff" opacity="0.5"/>
      <circle cx="845" cy="55" r="2" fill="#ffffff" opacity="0.6"/>
      <circle cx="865" cy="230" r="1.5" fill="#ffffff" opacity="0.4"/>
      <line x1="575" y1="65" x2="610" y2="95" stroke="#ffffff" stroke-width="0.5" stroke-opacity="0.15" stroke-dasharray="3 3"/>
      <line x1="845" y1="55" x2="810" y2="85" stroke="#ffffff" stroke-width="0.5" stroke-opacity="0.15" stroke-dasharray="3 3"/>
    </g>

    <!-- Rotating Wireframe Longitude Grid (The Sphere) -->
    <g class="globe-rotator">
      <!-- Meridian 1 -->
      <ellipse cx="710" cy="150" rx="92" ry="92" fill="none" stroke="#ffffff" stroke-width="0.8" stroke-opacity="0.35"/>
      <!-- Meridian 2 -->
      <ellipse cx="710" cy="150" rx="65" ry="92" fill="none" stroke="#ffffff" stroke-width="0.6" stroke-opacity="0.22"/>
      <!-- Meridian 3 -->
      <ellipse cx="710" cy="150" rx="32" ry="92" fill="none" stroke="#ffffff" stroke-width="0.6" stroke-opacity="0.2"/>
      <!-- Meridian 4 (Center vertical) -->
      <line x1="710" y1="58" x2="710" y2="242" stroke="#ffffff" stroke-width="0.6" stroke-opacity="0.25"/>
      <!-- Latitudes (Horizontal Rings) -->
      <ellipse cx="710" cy="150" rx="92" ry="24" fill="none" stroke="#ffffff" stroke-width="0.8" stroke-opacity="0.35"/>
      <ellipse cx="710" cy="115" rx="84" ry="18" fill="none" stroke="#ffffff" stroke-width="0.5" stroke-opacity="0.2"/>
      <ellipse cx="710" cy="185" rx="84" ry="18" fill="none" stroke="#ffffff" stroke-width="0.5" stroke-opacity="0.2"/>
      <ellipse cx="710" cy="85" rx="60" ry="12" fill="none" stroke="#ffffff" stroke-width="0.5" stroke-opacity="0.15"/>
      <ellipse cx="710" cy="215" rx="60" ry="12" fill="none" stroke="#ffffff" stroke-width="0.5" stroke-opacity="0.15"/>
    </g>

    <!-- Tilted Dynamic Orbital Network Rings -->
    <!-- Orbit 1: Tilted at 35 degrees -->
    <g class="orbit-1">
      <ellipse cx="710" cy="150" rx="118" ry="38" fill="none" stroke="#ffffff" stroke-width="1" stroke-opacity="0.4" stroke-dasharray="6 8"/>
      <!-- Traveling Data Packet on Orbit 1 -->
      <circle cx="828" cy="150" r="3.5" fill="#ffffff" filter="url(#whiteGlow)"/>
      <circle cx="592" cy="150" r="2.5" fill="#a1a1aa"/>
    </g>

    <!-- Orbit 2: Tilted at -45 degrees -->
    <g class="orbit-2">
      <ellipse cx="710" cy="150" rx="126" ry="34" fill="none" stroke="#ffffff" stroke-width="0.75" stroke-opacity="0.3" stroke-dasharray="4 6"/>
      <!-- Traveling Data Packet on Orbit 2 -->
      <circle cx="710" cy="116" r="3.5" fill="#ffffff" filter="url(#whiteGlow)"/>
      <circle cx="710" cy="184" r="2.5" fill="#a1a1aa"/>
    </g>

    <!-- Orbit 3: Steep Polar Network Ring -->
    <g class="orbit-3">
      <ellipse cx="710" cy="150" rx="36" ry="128" fill="none" stroke="#ffffff" stroke-width="0.6" stroke-opacity="0.25" stroke-dasharray="8 10"/>
      <!-- Satellite Node -->
      <circle cx="710" cy="22" r="3" fill="#ffffff" filter="url(#whiteGlow)"/>
    </g>

    <!-- ==================== BOUNCING NETWORK ARCS & SIGNALS ==================== -->
    <!-- Major Network Hub Nodes on Globe Surface -->
    <!-- Hub A: North America / West (650, 110) -->
    <!-- Hub B: Europe / Node (710, 95) -->
    <!-- Hub C: Asia / India Hub (745, 140) -->
    <!-- Hub D: Pacific Node (775, 175) -->
    <!-- Hub E: South Hub (670, 195) -->

    <!-- Ping Ripples expanding from Hub C (India) & Hub A -->
    <circle cx="745" cy="140" r="2" fill="none" stroke="#ffffff" class="ping-1"/>
    <circle cx="650" cy="110" r="2" fill="none" stroke="#ffffff" class="ping-2"/>
    <circle cx="710" cy="95" r="2" fill="none" stroke="#ffffff" class="ping-3"/>
    <circle cx="670" cy="195" r="2" fill="none" stroke="#ffffff" class="ping-2"/>

    <!-- Network Arcs (Bouncing Curves Over Sphere) -->
    <!-- Arc 1: Hub A -> Hub B -->
    <path d="M 650 110 Q 675 80 710 95" fill="none" stroke="#ffffff" stroke-width="1.5" stroke-opacity="0.3"/>
    <path d="M 650 110 Q 675 80 710 95" fill="none" stroke="#ffffff" stroke-width="2.5" stroke-linecap="round" class="packet-1" filter="url(#whiteGlow)"/>

    <!-- Arc 2: Hub B -> Hub C (India) -->
    <path d="M 710 95 Q 740 105 745 140" fill="none" stroke="#ffffff" stroke-width="1.5" stroke-opacity="0.3"/>
    <path d="M 710 95 Q 740 105 745 140" fill="none" stroke="#ffffff" stroke-width="2.5" stroke-linecap="round" class="packet-2" filter="url(#whiteGlow)"/>

    <!-- Arc 3: Hub C -> Hub D -->
    <path d="M 745 140 Q 770 145 775 175" fill="none" stroke="#ffffff" stroke-width="1.5" stroke-opacity="0.3"/>
    <path d="M 745 140 Q 770 145 775 175" fill="none" stroke="#ffffff" stroke-width="2.5" stroke-linecap="round" class="packet-3" filter="url(#whiteGlow)"/>

    <!-- Arc 4: Hub D -> Hub E -->
    <path d="M 775 175 Q 720 215 670 195" fill="none" stroke="#ffffff" stroke-width="1.5" stroke-opacity="0.3"/>
    <path d="M 775 175 Q 720 215 670 195" fill="none" stroke="#ffffff" stroke-width="2.5" stroke-linecap="round" class="packet-4" filter="url(#whiteGlow)"/>

    <!-- Arc 5: Hub E -> Hub A (Closing Global Loop) -->
    <path d="M 670 195 Q 630 155 650 110" fill="none" stroke="#ffffff" stroke-width="1.5" stroke-opacity="0.3"/>
    <path d="M 670 195 Q 630 155 650 110" fill="none" stroke="#ffffff" stroke-width="2.5" stroke-linecap="round" class="packet-1" filter="url(#whiteGlow)"/>

    <!-- Cross-Continental Bouncing Arc (Long-Distance Packet) -->
    <path d="M 650 110 Q 710 140 775 175" fill="none" stroke="#ffffff" stroke-width="1" stroke-opacity="0.2" stroke-dasharray="3 3"/>
    <path d="M 650 110 Q 710 140 775 175" fill="none" stroke="#ffffff" stroke-width="2" stroke-linecap="round" class="packet-2" filter="url(#whiteGlow)"/>

    <!-- Network Hub Nodes (Fixed Glowing Points) -->
    <circle cx="650" cy="110" r="4" fill="#ffffff" filter="url(#whiteGlow)" class="blink-fast"/>
    <circle cx="650" cy="110" r="1.8" fill="#000000"/>

    <circle cx="710" cy="95" r="4" fill="#ffffff" filter="url(#whiteGlow)" class="blink-med"/>
    <circle cx="710" cy="95" r="1.8" fill="#000000"/>

    <!-- Main Active Node (India Hub - Extra Glow) -->
    <circle cx="745" cy="140" r="5" fill="#ffffff" filter="url(#whiteGlow)" class="blink-fast"/>
    <circle cx="745" cy="140" r="2" fill="#000000"/>

    <circle cx="775" cy="175" r="4" fill="#ffffff" filter="url(#whiteGlow)" class="blink-slow"/>
    <circle cx="775" cy="175" r="1.8" fill="#000000"/>

    <circle cx="670" cy="195" r="4" fill="#ffffff" filter="url(#whiteGlow)" class="blink-med"/>
    <circle cx="670" cy="195" r="1.8" fill="#000000"/>

    <!-- Intermediate Small Relay Nodes -->
    <circle cx="685" cy="125" r="2" fill="#ffffff" opacity="0.7" class="blink-slow"/>
    <circle cx="730" cy="160" r="2" fill="#ffffff" opacity="0.7" class="blink-fast"/>
    <circle cx="700" cy="175" r="2.5" fill="#ffffff" opacity="0.8" class="blink-med"/>
    <circle cx="735" cy="110" r="2" fill="#ffffff" opacity="0.6" class="star-2"/>

    <!-- Surrounding Floating Crosshairs / Marks -->
    <g stroke="#ffffff" stroke-width="0.75" stroke-opacity="0.4">
      <!-- Top Right Mark -->
      <line x1="840" y1="40" x2="850" y2="40"/>
      <line x1="845" y1="35" x2="845" y2="45"/>
      <!-- Bottom Left Mark -->
      <line x1="570" y1="255" x2="580" y2="255"/>
      <line x1="575" y1="250" x2="575" y2="260"/>
    </g>

    <!-- Mini Globe Coordinate Tag -->
    <text x="710" y="268" text-anchor="middle" fill="#71717a" font-family="'Fira Code', monospace" font-size="8.5" letter-spacing="1.5">
      GLOBE: 360° SYNCHRONIZED // 10.4K NODES
    </text>
  </g>
</svg>