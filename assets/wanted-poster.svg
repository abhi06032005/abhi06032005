<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 390" width="100%" height="100%" fill="none">
  <defs>
    <!-- Parchment Paper Gradients -->
    <linearGradient id="posterPaper" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fdf6e2"/>
      <stop offset="50%" stop-color="#f4ecd8"/>
      <stop offset="100%" stop-color="#e2d4b7"/>
    </linearGradient>

    <!-- Dark Codex Background -->
    <linearGradient id="codexBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f0c1b"/>
      <stop offset="50%" stop-color="#19132d"/>
      <stop offset="100%" stop-color="#0b0817"/>
    </linearGradient>

    <!-- Gold Text Gradient -->
    <linearGradient id="goldText" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ffd54f"/>
      <stop offset="100%" stop-color="#ff6f00"/>
    </linearGradient>

    <!-- Haki Filter -->
    <filter id="hakiPosterGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="4" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <!-- Texture Pattern for Parchment -->
    <pattern id="parchmentNoise" width="20" height="20" patternUnits="userSpaceOnUse">
      <rect width="20" height="20" fill="#000000" opacity="0.02"/>
      <circle cx="5" cy="5" r="1" fill="#8d6e63" opacity="0.08"/>
      <circle cx="15" cy="15" r="1.5" fill="#8d6e63" opacity="0.06"/>
    </pattern>
  </defs>

  <style>
    @keyframes lightningFlash {
      0%, 90%, 96%, 100% { opacity: 0; }
      91%, 95% { opacity: 0.95; filter: drop-shadow(0 0 10px #ff1744); }
      93% { opacity: 1; filter: drop-shadow(0 0 16px #d50000); }
    }

    @keyframes auraPulse {
      0%, 100% { transform: scale(1); opacity: 0.2; }
      50% { transform: scale(1.06); opacity: 0.5; }
    }

    @keyframes coinShine {
      0%, 100% { opacity: 0.7; }
      50% { opacity: 1; filter: drop-shadow(0 0 6px #fbc02d); }
    }

    .haki-arc { animation: lightningFlash 3.5s infinite; }
    .haki-arc-2 { animation: lightningFlash 4.2s infinite 1.5s; }
    .aura-glow { transform-origin: 140px 175px; animation: auraPulse 3s ease-in-out infinite; }
    .berry-icon { animation: coinShine 2s ease-in-out infinite; }
  </style>

  <!-- Container Box -->
  <rect x="2" y="2" width="896" height="386" rx="14" fill="url(#codexBg)" stroke="#fbc02d" stroke-width="1.5" stroke-opacity="0.4"/>

  <!-- ============================================================= -->
  <!-- LEFT: AUTHENTIC ONE PIECE WANTED POSTER                       -->
  <!-- ============================================================= -->
  <g transform="translate(24, 18)">
    <!-- Poster Background -->
    <rect width="275" height="350" rx="4" fill="url(#posterPaper)" stroke="#5d4037" stroke-width="2"/>
    <rect width="275" height="350" rx="4" fill="url(#parchmentNoise)"/>

    <!-- Wanted Poster Header -->
    <text x="137" y="38" text-anchor="middle" fill="#3e2723" font-family="'Impact', 'Times New Roman', serif" font-size="34" letter-spacing="4">
      WANTED
    </text>

    <!-- Photo Frame -->
    <rect x="22" y="48" width="231" height="195" fill="#2b1810" stroke="#4e342e" stroke-width="2"/>

    <!-- Inside Photo: Dark Pirate Aura & Avatar -->
    <rect x="24" y="50" width="227" height="191" fill="#150d1b"/>

    <!-- Conqueror Haki Red Aura Circle -->
    <circle class="aura-glow" cx="137" cy="145" r="65" fill="#ff1744"/>

    <!-- Avatar Character Silhouette with Straw Hat -->
    <g transform="translate(137, 140)">
      <!-- Developer Hoodie / Coat Shoulders -->
      <path d="M -55 60 Q 0 35 55 60 L 55 90 L -55 90 Z" fill="#2d1b38"/>
      <!-- Face -->
      <ellipse cx="0" cy="10" rx="22" ry="24" fill="#ffcc80"/>
      <!-- Cool Glasses -->
      <rect x="-18" y="4" width="16" height="8" rx="2" fill="#00e5ff" opacity="0.9"/>
      <rect x="2" y="4" width="16" height="8" rx="2" fill="#00e5ff" opacity="0.9"/>
      <line x1="-2" y1="8" x2="2" y2="8" stroke="#ffffff" stroke-width="1.5"/>
      <!-- Straw Hat -->
      <ellipse cx="0" cy="-12" rx="38" ry="10" fill="#fbc02d" stroke="#f57f17" stroke-width="1"/>
      <path d="M -22 -12 Q 0 -38 22 -12 Z" fill="#fbc02d"/>
      <path d="M -22 -12 Q 0 -17 22 -12 L 22 -7 Q 0 -12 -22 -7 Z" fill="#d50000"/>
    </g>

    <!-- Crackling Conqueror Haki Lightning Over Photo -->
    <g class="haki-arc" filter="url(#hakiPosterGlow)">
      <path d="M 40 70 L 70 110 L 50 130 L 90 170 L 70 190 L 110 230" stroke="#ff1744" stroke-width="3" fill="none"/>
      <path d="M 45 70 L 75 110 L 55 130 L 95 170" stroke="#ffffff" stroke-width="1.2" fill="none"/>
    </g>
    <g class="haki-arc-2" filter="url(#hakiPosterGlow)">
      <path d="M 230 80 L 200 120 L 220 140 L 180 180 L 200 200 L 170 235" stroke="#ff0055" stroke-width="3" fill="none"/>
    </g>

    <!-- DEAD OR ALIVE Subtitle -->
    <text x="137" y="260" text-anchor="middle" fill="#3e2723" font-family="'Times New Roman', serif" font-weight="bold" font-size="14" letter-spacing="2">
      DEAD OR ALIVE
    </text>

    <!-- Name: ABHIJEET NAYAK -->
    <text x="137" y="286" text-anchor="middle" fill="#271306" font-family="'Impact', 'Arial Black', sans-serif" font-size="21" letter-spacing="1">
      ABHIJEET NAYAK
    </text>

    <!-- Bounty Line -->
    <g transform="translate(30, 318)">
      <!-- Berry Symbol (฿) -->
      <text class="berry-icon" x="0" y="0" fill="#b71c1c" font-family="'Impact', sans-serif" font-size="19">฿</text>
      <!-- Bounty Amount -->
      <text x="18" y="-1" fill="#3e2723" font-family="'Impact', 'Arial Black', sans-serif" font-size="19" letter-spacing="1">
        3,000,000,000 -
      </text>
    </g>

    <!-- Marine Red Seal Stamp -->
    <g transform="translate(195, 298)">
      <rect x="0" y="0" width="62" height="28" rx="3" fill="none" stroke="#d50000" stroke-width="1.8" stroke-dasharray="4 1" opacity="0.85"/>
      <text x="31" y="14" text-anchor="middle" fill="#d50000" font-family="'Impact', sans-serif" font-size="9" letter-spacing="0.5">MARINE HQ</text>
      <text x="31" y="24" text-anchor="middle" fill="#d50000" font-family="'Arial', sans-serif" font-weight="bold" font-size="7">AUTHORIZED</text>
    </g>
  </g>

  <!-- ============================================================= -->
  <!-- RIGHT: PIRATE CAPTAIN'S CODEX & GRAND LINE TELEMETRY         -->
  <!-- ============================================================= -->
  <g transform="translate(325, 26)">
    <!-- Header -->
    <text x="0" y="16" fill="url(#goldText)" font-family="'Segoe UI', -apple-system, sans-serif" font-size="16" font-weight="900" letter-spacing="1.5">
      📜 PIRATE KING'S LOG // FULL-STACK ARCHITECT
    </text>
    <line x1="0" y1="28" x2="540" y2="28" stroke="#fbc02d" stroke-width="1" stroke-opacity="0.3"/>

    <!-- Key Attributes Grid -->
    <g transform="translate(0, 48)">
      <!-- Attribute 1: Role -->
      <text x="0" y="0" fill="#fde047" font-family="'Fira Code', monospace" font-size="12" font-weight="bold">
        ⚔️ CREW ROLE: <tspan fill="#ffffff">Captain &amp; Full-Stack Architect</tspan>
      </text>

      <!-- Attribute 2: Devil Fruit -->
      <text x="0" y="24" fill="#fde047" font-family="'Fira Code', monospace" font-size="12" font-weight="bold">
        🍇 DEVIL FRUIT: <tspan fill="#c084fc">Hito Hito no Mi, Model: Full-Stack (Awakened)</tspan>
      </text>

      <!-- Attribute 3: Conqueror's Haki -->
      <text x="0" y="48" fill="#fde047" font-family="'Fira Code', monospace" font-size="12" font-weight="bold">
        ⚡ HAKI DOMAIN: <tspan fill="#38bdf8">Next.js • Node.js • Vector RAG • Distributed Tech</tspan>
      </text>

      <!-- Attribute 4: Academic Origin -->
      <text x="0" y="72" fill="#fde047" font-family="'Fira Code', monospace" font-size="12" font-weight="bold">
        🎓 ACADEMICS: <tspan fill="#34d399">BCA (8.9 CGPA) • Strong CS &amp; DSA Mastery</tspan>
      </text>
    </g>

    <!-- Grand Line Conquests & Metrics Box -->
    <g transform="translate(0, 148)">
      <rect width="540" height="175" rx="8" fill="#130e24" stroke="#7000ff" stroke-width="1" stroke-opacity="0.4"/>
      
      <text x="18" y="24" fill="#fbc02d" font-family="'Segoe UI', sans-serif" font-size="12" font-weight="800" letter-spacing="1">
        🚩 GRAND LINE CONQUESTS &amp; PRODUCTION ACHIEVEMENTS
      </text>

      <!-- Achievement 1 -->
      <g transform="translate(18, 48)">
        <circle cx="4" cy="-4" r="3" fill="#ff1744"/>
        <text x="14" y="0" fill="#e2e8f0" font-family="'Segoe UI', sans-serif" font-size="12">
          🏆 <tspan fill="#ffd54f" font-weight="bold">Hackfest Top 50 Finalist</tspan> out of <tspan fill="#ffffff" font-weight="bold">1,100+ competing engineering crews</tspan>
        </text>
      </g>

      <!-- Achievement 2 -->
      <g transform="translate(18, 74)">
        <circle cx="4" cy="-4" r="3" fill="#38bdf8"/>
        <text x="14" y="0" fill="#e2e8f0" font-family="'Segoe UI', sans-serif" font-size="12">
          ⚡ <tspan fill="#38bdf8" font-weight="bold">Production Speed Surge:</tspan> Slashed load latency by <tspan fill="#34d399" font-weight="bold">~35%</tspan> and CMS time by <tspan fill="#34d399" font-weight="bold">~95%</tspan>
        </text>
      </g>

      <!-- Achievement 3 -->
      <g transform="translate(18, 100)">
        <circle cx="4" cy="-4" r="3" fill="#34d399"/>
        <text x="14" y="0" fill="#e2e8f0" font-family="'Segoe UI', sans-serif" font-size="12">
          🚢 <tspan fill="#34d399" font-weight="bold">4x Production Products Shipped:</tspan> FinGuard AI, RAG PDF Chat, Real-Time Collab
        </text>
      </g>

      <!-- Achievement 4 -->
      <g transform="translate(18, 126)">
        <circle cx="4" cy="-4" r="3" fill="#e040fb"/>
        <text x="14" y="0" fill="#e2e8f0" font-family="'Segoe UI', sans-serif" font-size="12">
          🎯 <tspan fill="#e040fb" font-weight="bold">200+ DSA algorithmic trials</tspan> solved + <tspan fill="#ffd54f" font-weight="bold">5-Star HackerRank SQL</tspan>
        </text>
      </g>

      <!-- Bottom Quote Tag -->
      <text x="18" y="156" fill="#94a3b8" font-family="'Courier New', monospace" font-size="10.5" font-style="italic">
        "If you don't take risks, you can't create a future." — Monkey D. Luffy
      </text>
    </g>
  </g>
</svg>
