<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 400" width="100%" height="100%" fill="none">
  <defs>
    <!-- Parchment Paper Gradients -->
    <linearGradient id="posterPaper" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fdf5e2"/>
      <stop offset="50%" stop-color="#f4ebd4"/>
      <stop offset="100%" stop-color="#e0d1af"/>
    </linearGradient>

    <!-- Dark Codex Background -->
    <linearGradient id="codexBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0e0a1a"/>
      <stop offset="50%" stop-color="#18112b"/>
      <stop offset="100%" stop-color="#0a0714"/>
    </linearGradient>

    <!-- Gold Text Gradient -->
    <linearGradient id="goldText" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ffd54f"/>
      <stop offset="100%" stop-color="#ff6f00"/>
    </linearGradient>

    <filter id="hakiGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="4" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <style>
    @keyframes lightningFlash {
      0%, 90%, 96%, 100% { opacity: 0; }
      91%, 95% { opacity: 0.95; filter: drop-shadow(0 0 10px #ff1744); }
      93% { opacity: 1; filter: drop-shadow(0 0 16px #d50000); }
    }
    @keyframes auraPulse {
      0%, 100% { transform: scale(1); opacity: 0.3; }
      50% { transform: scale(1.06); opacity: 0.6; }
    }
    @keyframes coinShine {
      0%, 100% { opacity: 0.8; }
      50% { opacity: 1; filter: drop-shadow(0 0 8px #fbc02d); }
    }

    .haki-arc { animation: lightningFlash 3.5s infinite; }
    .haki-arc-2 { animation: lightningFlash 4.2s infinite 1.5s; }
    .aura-glow { transform-origin: 140px 145px; animation: auraPulse 3s ease-in-out infinite; }
    .berry-icon { animation: coinShine 2s ease-in-out infinite; }
  </style>

  <!-- Container Box -->
  <rect x="2" y="2" width="916" height="396" rx="14" fill="url(#codexBg)" stroke="#fbc02d" stroke-width="1.5" stroke-opacity="0.5"/>

  <!-- ============================================================= -->
  <!-- LEFT: AUTHENTIC ONE PIECE WANTED POSTER (LUFFY STRAW HAT)    -->
  <!-- ============================================================= -->
  <g transform="translate(24, 20)">
    <!-- Poster Background -->
    <rect width="280" height="360" rx="4" fill="url(#posterPaper)" stroke="#5d4037" stroke-width="2"/>

    <!-- Wanted Poster Header -->
    <text x="140" y="40" text-anchor="middle" fill="#3e2723" font-family="'Impact', 'Times New Roman', serif" font-size="36" letter-spacing="4">
      WANTED
    </text>

    <!-- Photo Frame -->
    <rect x="22" y="52" width="236" height="198" fill="#1b1220" stroke="#4e342e" stroke-width="2"/>

    <!-- Inside Photo: Conqueror Haki Red Aura -->
    <circle class="aura-glow" cx="140" cy="150" r="70" fill="#ff1744"/>

    <!-- REAL MONKEY D. LUFFY DETAILED ART IN WANTED POSTER -->
    <g transform="translate(140, 148)">
      <!-- Shoulders / Open Red Shirt -->
      <path d="M -58 65 Q 0 40 58 65 L 58 85 L -58 85 Z" fill="#d32f2f"/>
      <path d="M -20 50 Q 0 75 20 50 L 15 85 L -15 85 Z" fill="#ffcc80"/>
      <!-- Chest X-Scar -->
      <path d="M -12 60 L 12 76 M 12 60 L -12 76" stroke="#b71c1c" stroke-width="2.5"/>

      <!-- Luffy Neck & Face -->
      <ellipse cx="0" cy="16" rx="26" ry="28" fill="#ffcc80"/>
      
      <!-- Signature Eye Scar under left eye -->
      <path d="M -12 18 L -12 24 M -16 21 L -8 21" stroke="#5d4037" stroke-width="1.2"/>

      <!-- Big Iconic Luffy Grin with Teeth -->
      <path d="M -18 22 Q 0 42 18 22 Z" fill="#d32f2f" stroke="#5d4037" stroke-width="1"/>
      <path d="M -16 23 Q 0 35 16 23 Z" fill="#ffffff"/>
      <!-- Teeth Grid lines -->
      <line x1="-8" y1="24" x2="-8" y2="30" stroke="#d7ccc8" stroke-width="0.8"/>
      <line x1="0" y1="24" x2="0" y2="32" stroke="#d7ccc8" stroke-width="0.8"/>
      <line x1="8" y1="24" x2="8" y2="30" stroke="#d7ccc8" stroke-width="0.8"/>

      <!-- Eyes (Happy Big Arcs / Big Eyes) -->
      <circle cx="-11" cy="14" r="3.5" fill="#212121"/>
      <circle cx="11" cy="14" r="3.5" fill="#212121"/>
      <circle cx="-12" cy="13" r="1" fill="#ffffff"/>
      <circle cx="10" cy="13" r="1" fill="#ffffff"/>

      <!-- Black Spiky Hair -->
      <path d="M -28 14 Q -35 -5 -20 -12 Q -28 -22 -10 -20 Q 0 -30 10 -20 Q 28 -22 20 -12 Q 35 -5 28 14 Z" fill="#212121"/>

      <!-- Straw Hat on Luffy's Head -->
      <ellipse cx="0" cy="-14" rx="42" ry="12" fill="#fbc02d" stroke="#f57f17" stroke-width="1.5"/>
      <path d="M -25 -14 Q 0 -44 25 -14 Z" fill="#fbc02d"/>
      <path d="M -25 -14 Q 0 -22 25 -14 L 25 -8 Q 0 -16 -25 -8 Z" fill="#d50000"/>
    </g>

    <!-- Crackling Conqueror Haki Lightning Over Photo -->
    <g class="haki-arc" filter="url(#hakiGlow)">
      <path d="M 40 75 L 70 115 L 50 135 L 90 175 L 70 195 L 110 235" stroke="#ff1744" stroke-width="3" fill="none"/>
      <path d="M 45 75 L 75 115 L 55 135 L 95 175" stroke="#ffffff" stroke-width="1.2" fill="none"/>
    </g>
    <g class="haki-arc-2" filter="url(#hakiGlow)">
      <path d="M 235 85 L 205 125 L 225 145 L 185 185 L 205 205 L 175 240" stroke="#ff0055" stroke-width="3" fill="none"/>
    </g>

    <!-- DEAD OR ALIVE Subtitle -->
    <text x="140" y="268" text-anchor="middle" fill="#3e2723" font-family="'Times New Roman', serif" font-weight="bold" font-size="14" letter-spacing="2">
      DEAD OR ALIVE
    </text>

    <!-- Name: ABHIJEET NAYAK -->
    <text x="140" y="295" text-anchor="middle" fill="#271306" font-family="'Impact', 'Arial Black', sans-serif" font-size="21" letter-spacing="1">
      ABHIJEET NAYAK
    </text>

    <!-- Bounty Line -->
    <g transform="translate(30, 328)">
      <text class="berry-icon" x="0" y="0" fill="#b71c1c" font-family="'Impact', sans-serif" font-size="20">฿</text>
      <text x="18" y="-1" fill="#3e2723" font-family="'Impact', 'Arial Black', sans-serif" font-size="20" letter-spacing="1">
        3,000,000,000 -
      </text>
    </g>

    <!-- Marine Red Seal Stamp -->
    <g transform="translate(200, 308)">
      <rect x="0" y="0" width="64" height="30" rx="3" fill="none" stroke="#d50000" stroke-width="1.8" stroke-dasharray="4 1" opacity="0.85"/>
      <text x="32" y="15" text-anchor="middle" fill="#d50000" font-family="'Impact', sans-serif" font-size="9.5" letter-spacing="0.5">MARINE HQ</text>
      <text x="32" y="25" text-anchor="middle" fill="#d50000" font-family="'Arial', sans-serif" font-weight="bold" font-size="7.5">AUTHORIZED</text>
    </g>
  </g>

  <!-- ============================================================= -->
  <!-- RIGHT: PIRATE CAPTAIN'S CODEX & ARCHITECT PROFILE            -->
  <!-- ============================================================= -->
  <g transform="translate(330, 26)">
    <!-- Header -->
    <text x="0" y="18" fill="url(#goldText)" font-family="'Segoe UI', -apple-system, sans-serif" font-size="16.5" font-weight="900" letter-spacing="1.5">
      📜 PIRATE KING'S CODEX // FULL-STACK ARCHITECT
    </text>
    <line x1="0" y1="30" x2="560" y2="30" stroke="#fbc02d" stroke-width="1" stroke-opacity="0.3"/>

    <!-- Key Attributes Grid -->
    <g transform="translate(0, 52)">
      <text x="0" y="0" fill="#fde047" font-family="'Fira Code', monospace" font-size="12" font-weight="bold">
        ⚔️ CREW ROLE: <tspan fill="#ffffff">Captain &amp; Full-Stack SDE</tspan>
      </text>
      <text x="0" y="24" fill="#fde047" font-family="'Fira Code', monospace" font-size="12" font-weight="bold">
        🍇 DEVIL FRUIT: <tspan fill="#c084fc">Hito Hito no Mi, Model: Full-Stack (Awakened)</tspan>
      </text>
      <text x="0" y="48" fill="#fde047" font-family="'Fira Code', monospace" font-size="12" font-weight="bold">
        ⚡ HAKI DOMAIN: <tspan fill="#38bdf8">Next.js • Node.js • Vector RAG • Distributed Tech</tspan>
      </text>
      <text x="0" y="72" fill="#fde047" font-family="'Fira Code', monospace" font-size="12" font-weight="bold">
        🎓 ACADEMICS: <tspan fill="#34d399">BCA (8.9 CGPA) • Strong CS Fundamentals &amp; DSA</tspan>
      </text>
    </g>

    <!-- Grand Line Conquests & Metrics Box -->
    <g transform="translate(0, 155)">
      <rect width="560" height="185" rx="8" fill="#130e24" stroke="#7000ff" stroke-width="1" stroke-opacity="0.4"/>
      
      <text x="18" y="24" fill="#fbc02d" font-family="'Segoe UI', sans-serif" font-size="12" font-weight="800" letter-spacing="1">
        🚩 GRAND LINE CONQUESTS &amp; PRODUCTION ACHIEVEMENTS
      </text>

      <g transform="translate(18, 50)">
        <circle cx="4" cy="-4" r="3" fill="#ff1744"/>
        <text x="14" y="0" fill="#e2e8f0" font-family="'Segoe UI', sans-serif" font-size="12">
          🏆 <tspan fill="#ffd54f" font-weight="bold">Hackfest Top 50 Finalist</tspan> out of <tspan fill="#ffffff" font-weight="bold">1,100+ competing engineering crews</tspan>
        </text>
      </g>

      <g transform="translate(18, 76)">
        <circle cx="4" cy="-4" r="3" fill="#38bdf8"/>
        <text x="14" y="0" fill="#e2e8f0" font-family="'Segoe UI', sans-serif" font-size="12">
          ⚡ <tspan fill="#38bdf8" font-weight="bold">Production Speed Surge:</tspan> Slashed load latency by <tspan fill="#34d399" font-weight="bold">~35%</tspan> and CMS time by <tspan fill="#34d399" font-weight="bold">~95%</tspan>
        </text>
      </g>

      <g transform="translate(18, 102)">
        <circle cx="4" cy="-4" r="3" fill="#34d399"/>
        <text x="14" y="0" fill="#e2e8f0" font-family="'Segoe UI', sans-serif" font-size="12">
          🚢 <tspan fill="#34d399" font-weight="bold">4x Production Products Shipped:</tspan> FinGuard AI, RAG PDF Chat, Real-Time Collab
        </text>
      </g>

      <g transform="translate(18, 128)">
        <circle cx="4" cy="-4" r="3" fill="#e040fb"/>
        <text x="14" y="0" fill="#e2e8f0" font-family="'Segoe UI', sans-serif" font-size="12">
          🎯 <tspan fill="#e040fb" font-weight="bold">200+ DSA algorithmic trials</tspan> solved + <tspan fill="#ffd54f" font-weight="bold">5-Star HackerRank SQL</tspan>
        </text>
      </g>

      <text x="18" y="160" fill="#94a3b8" font-family="'Courier New', monospace" font-size="11" font-style="italic">
        "If you don't take risks, you can't create a future." — Monkey D. Luffy
      </text>
    </g>
  </g>
</svg>
