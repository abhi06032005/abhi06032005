<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 90" width="100%" height="100%" fill="none">
  <defs>
    <linearGradient id="musicBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a0a14"/>
      <stop offset="100%" stop-color="#140f28"/>
    </linearGradient>

    <linearGradient id="spotifyGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#1db954"/>
      <stop offset="100%" stop-color="#00f0ff"/>
    </linearGradient>

    <filter id="musicGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <style>
    @keyframes eqWave1 { 0%, 100% { height: 4px; y: 56px; } 50% { height: 24px; y: 36px; } }
    @keyframes eqWave2 { 0%, 100% { height: 22px; y: 38px; } 50% { height: 6px; y: 54px; } }
    @keyframes eqWave3 { 0%, 100% { height: 8px; y: 52px; } 50% { height: 26px; y: 34px; } }
    @keyframes eqWave4 { 0%, 100% { height: 26px; y: 34px; } 50% { height: 10px; y: 50px; } }
    @keyframes spinVinyl { from { transform: rotate(0deg); } to { transform: rotate(360deg); } }
    @keyframes progressPulse { 0% { width: 120px; } 50% { width: 180px; } 100% { width: 120px; } }

    .b1 { animation: eqWave1 0.9s ease-in-out infinite; }
    .b2 { animation: eqWave2 1.2s ease-in-out infinite 0.1s; }
    .b3 { animation: eqWave3 0.8s ease-in-out infinite 0.3s; }
    .b4 { animation: eqWave4 1.4s ease-in-out infinite 0.2s; }
    .b5 { animation: eqWave1 1.0s ease-in-out infinite 0.4s; }
    .b6 { animation: eqWave3 0.7s ease-in-out infinite 0.15s; }
    .b7 { animation: eqWave2 1.3s ease-in-out infinite 0.25s; }
    .b8 { animation: eqWave4 1.1s ease-in-out infinite 0.35s; }
    .vinyl-disc { transform-origin: 45px 45px; animation: spinVinyl 8s linear infinite; }
    .prog { animation: progressPulse 8s ease-in-out infinite; }
  </style>

  <!-- Container -->
  <rect x="1" y="1" width="558" height="88" rx="12" fill="url(#musicBg)" stroke="#1db954" stroke-width="1" stroke-opacity="0.35"/>

  <!-- Spinning Vinyl / Album Glow -->
  <g class="vinyl-disc">
    <circle cx="45" cy="45" r="28" fill="#181824" stroke="#00f0ff" stroke-width="1.5" stroke-opacity="0.5"/>
    <circle cx="45" cy="45" r="20" fill="none" stroke="#2e2e48" stroke-width="1"/>
    <circle cx="45" cy="45" r="12" fill="none" stroke="#2e2e48" stroke-width="1"/>
    <circle cx="45" cy="45" r="7" fill="#1db954" filter="url(#musicGlow)"/>
  </g>

  <!-- Now Playing Text Info -->
  <g transform="translate(86, 26)">
    <!-- Header status -->
    <text x="0" y="0" fill="#1db954" font-family="'Segoe UI', sans-serif" font-size="10" font-weight="700" letter-spacing="1">
      ♫ SPOTIFY • NOW STREAMING // FLOW STATE
    </text>
    <!-- Song Title -->
    <text x="0" y="18" fill="#ffffff" font-family="'Segoe UI', -apple-system, sans-serif" font-size="13" font-weight="700">
      Synthwave &amp; Algorithms (Deep Focus 128 BPM)
    </text>
    <!-- Artist -->
    <text x="0" y="34" fill="#94a3b8" font-family="'Segoe UI', sans-serif" font-size="11">
      Cyberpunk Chill Radio • Continuous Build Mode
    </text>
  </g>

  <!-- Animated Equalizer Bars on Right -->
  <g transform="translate(470, 0)">
    <rect class="b1" x="0" y="45" width="4" height="15" rx="2" fill="#1db954"/>
    <rect class="b2" x="7" y="45" width="4" height="15" rx="2" fill="#00f0ff"/>
    <rect class="b3" x="14" y="45" width="4" height="15" rx="2" fill="#38bdf8"/>
    <rect class="b4" x="21" y="45" width="4" height="15" rx="2" fill="#818cf8"/>
    <rect class="b5" x="28" y="45" width="4" height="15" rx="2" fill="#c084fc"/>
    <rect class="b6" x="35" y="45" width="4" height="15" rx="2" fill="#f472b6"/>
    <rect class="b7" x="42" y="45" width="4" height="15" rx="2" fill="#00f0ff"/>
    <rect class="b8" x="49" y="45" width="4" height="15" rx="2" fill="#1db954"/>
  </g>
</svg>
