<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 340" width="100%" height="100%" fill="none">
  <defs>
    <!-- Grand Line Twilight Sky -->
    <linearGradient id="skyGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#050814"/>
      <stop offset="40%" stop-color="#0f1130"/>
      <stop offset="75%" stop-color="#24133b"/>
      <stop offset="100%" stop-color="#3d1542"/>
    </linearGradient>

    <!-- Pirate Gold Gradient -->
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#fff59d"/>
      <stop offset="40%" stop-color="#fbc02d"/>
      <stop offset="80%" stop-color="#f57f17"/>
      <stop offset="100%" stop-color="#ff3d00"/>
    </linearGradient>

    <!-- Ocean Gradients -->
    <linearGradient id="wave1" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#0284c7" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#072a4a"/>
    </linearGradient>
    <linearGradient id="wave2" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#0369a1" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#0a192f"/>
    </linearGradient>

    <!-- Haki Glow -->
    <filter id="hakiGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="4" result="blur1"/>
      <feGaussianBlur stdDeviation="2" result="blur2"/>
      <feMerge>
        <feMergeNode in="blur1"/>
        <feMergeNode in="blur2"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <!-- Moon Glow -->
    <filter id="moonGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <style>
    @keyframes waveRoll {
      0% { transform: translateX(0px); }
      100% { transform: translateX(-470px); }
    }
    @keyframes shipBob {
      0%, 100% { transform: translateY(0px) rotate(0deg); }
      25% { transform: translateY(-6px) rotate(2deg); }
      75% { transform: translateY(4px) rotate(-2deg); }
    }
    @keyframes luffyBounce {
      0%, 100% { transform: translateY(0px); }
      50% { transform: translateY(-5px); }
    }
    @keyframes zoroAura {
      0%, 100% { opacity: 0.4; filter: drop-shadow(0 0 6px #00e676); }
      50% { opacity: 0.9; filter: drop-shadow(0 0 14px #00e676); }
    }
    @keyframes hakiFlash {
      0%, 88%, 94%, 100% { opacity: 0; }
      89%, 93% { opacity: 0.95; filter: drop-shadow(0 0 10px #ff1744); }
      91% { opacity: 1; filter: drop-shadow(0 0 16px #ff0055); }
    }
    @keyframes starPulse {
      0%, 100% { opacity: 0.3; }
      50% { opacity: 1; transform: scale(1.2); }
    }
    @keyframes meteorPass {
      0% { transform: translate(0, 0); opacity: 0; }
      15% { opacity: 1; }
      35% { transform: translate(-140px, 90px); opacity: 0; }
      100% { transform: translate(-140px, 90px); opacity: 0; }
    }

    .wave-anim { animation: waveRoll 10s linear infinite; }
    .ship-anim { transform-origin: 740px 220px; animation: shipBob 4s ease-in-out infinite; }
    .luffy-anim { animation: luffyBounce 2s ease-in-out infinite; }
    .zoro-anim { animation: zoroAura 2.5s ease-in-out infinite; }
    .haki-arc { animation: hakiFlash 3.6s infinite; }
    .haki-arc-2 { animation: hakiFlash 4.8s infinite 1.6s; }
    .star { animation: starPulse 3s ease-in-out infinite; }
    .meteor { animation: meteorPass 7s ease-in infinite 1s; }
    .title-font { font-family: 'Impact', 'Segoe UI Black', -apple-system, sans-serif; }
  </style>

  <!-- Sky Background -->
  <rect width="940" height="340" rx="16" fill="url(#skyGrad)"/>

  <!-- Stars -->
  <circle class="star" cx="100" cy="40" r="1.5" fill="#ffffff"/>
  <circle class="star" cx="180" cy="70" r="2" fill="#fff59d"/>
  <circle class="star" cx="290" cy="30" r="1.2" fill="#ffffff"/>
  <circle class="star" cx="420" cy="50" r="2" fill="#ffe082"/>
  <circle class="star" cx="560" cy="35" r="1.8" fill="#ffffff"/>
  <circle class="star" cx="670" cy="60" r="1.5" fill="#fff59d"/>
  <circle class="star" cx="890" cy="40" r="2" fill="#ffe082"/>

  <!-- Meteor / Shooting Star -->
  <g class="meteor" transform="translate(680, 20)">
    <line x1="0" y1="0" x2="-45" y2="30" stroke="#fff59d" stroke-width="2" stroke-linecap="round"/>
  </g>

  <!-- Giant Glowing Moon -->
  <g transform="translate(760, 20)">
    <circle cx="45" cy="45" r="36" fill="#fffde7" filter="url(#moonGlow)"/>
    <circle cx="45" cy="45" r="34" fill="#fff9c4"/>
    <circle cx="36" cy="38" r="6" fill="#fbc02d" opacity="0.15"/>
    <circle cx="56" cy="48" r="8" fill="#fbc02d" opacity="0.12"/>
  </g>

  <!-- Conqueror's Haki Lightning (Red/Black) -->
  <g class="haki-arc" filter="url(#hakiGlow)">
    <path d="M 130 65 L 155 100 L 135 120 L 175 160 L 150 175 L 195 215" stroke="#ff1744" stroke-width="3" fill="none"/>
    <path d="M 135 65 L 160 100 L 140 120 L 180 160" stroke="#ffffff" stroke-width="1.2" fill="none"/>
  </g>
  <g class="haki-arc-2" filter="url(#hakiGlow)">
    <path d="M 520 70 L 490 110 L 510 130 L 475 170 L 495 185 L 460 225" stroke="#ff0055" stroke-width="3" fill="none"/>
  </g>

  <!-- Header Category -->
  <g transform="translate(48, 38)">
    <text x="0" y="16" fill="#fbc02d" font-family="'Segoe UI', -apple-system, sans-serif" font-weight="900" font-size="12" letter-spacing="2">
      海賊王 • THE GRAND LINE OF FULL-STACK &amp; AI ARCHITECTURE
    </text>
  </g>

  <!-- Main Hero Name: ABHIJEET NAYAK -->
  <g transform="translate(48, 126)">
    <text x="0" y="0" fill="url(#goldGrad)" class="title-font" font-size="54" letter-spacing="3">
      ABHIJEET NAYAK
    </text>
  </g>

  <!-- One Piece Tagline -->
  <g transform="translate(50, 162)">
    <text x="0" y="0" fill="#fde047" font-family="'Fira Code', monospace" font-size="13.5" font-weight="700" letter-spacing="0.5">
      <tspan fill="#ff3d00">⚔️ </tspan>CONQUEROR'S CODE <tspan fill="#94a3b8">|</tspan> FULL-STACK ARCHITECT <tspan fill="#94a3b8">•</tspan> NEXT.JS <tspan fill="#94a3b8">•</tspan> AI RAG <tspan fill="#94a3b8">•</tspan> DISTRIBUTED SYSTEMS
    </text>
  </g>

  <!-- Bounty Badges -->
  <g transform="translate(50, 192)">
    <!-- Bounty: ฿ 3,000,000,000 -->
    <g transform="translate(0, 0)">
      <rect width="180" height="32" rx="6" fill="#1b0f22" stroke="#fbc02d" stroke-width="1.2"/>
      <text x="12" y="21" fill="#fbc02d" font-family="'Segoe UI', sans-serif" font-weight="800" font-size="12">
        💰 BOUNTY: ฿ 3,000,000,000
      </text>
    </g>

    <!-- Hackfest Top 50 -->
    <g transform="translate(190, 0)">
      <rect width="185" height="32" rx="6" fill="#240f1a" stroke="#ff1744" stroke-width="1.2"/>
      <text x="12" y="21" fill="#ff4d6d" font-family="'Segoe UI', sans-serif" font-weight="800" font-size="12">
        🏆 Top 50 / 1100+ Hackfest
      </text>
    </g>

    <!-- BCA 8.9 CGPA -->
    <g transform="translate(385, 0)">
      <rect width="145" height="32" rx="6" fill="#0d1b30" stroke="#38bdf8" stroke-width="1.2"/>
      <text x="12" y="21" fill="#38bdf8" font-family="'Segoe UI', sans-serif" font-weight="800" font-size="12">
        🎓 BCA • 8.9 CGPA
      </text>
    </g>

    <!-- 4x Shipped -->
    <g transform="translate(540, 0)">
      <rect width="165" height="32" rx="6" fill="#0c241a" stroke="#34d399" stroke-width="1.2"/>
      <text x="12" y="21" fill="#34d399" font-family="'Segoe UI', sans-serif" font-weight="800" font-size="12">
        ⚡ 4x Prod Expeditions
      </text>
    </g>
  </g>

  <!-- ============================================================= -->
  <!-- REAL ONE PIECE CHARACTERS: LUFFY (GEAR 5) & ZORO ON SUNNY     -->
  <!-- ============================================================= -->

  <!-- Thousand Sunny Ship with Real Luffy & Zoro -->
  <g class="ship-anim" transform="translate(710, 160)">
    <!-- Ship Hull -->
    <path d="M 0 65 Q 35 85 95 82 Q 115 65 125 50 L 10 50 Z" fill="#5d4037" stroke="#3e2723" stroke-width="1.5"/>
    <path d="M 8 58 Q 55 72 112 56" stroke="#fbc02d" stroke-width="2.5" fill="none"/>
    
    <!-- Thousand Sunny Lion Figurehead (Sunny Head) -->
    <circle cx="124" cy="48" r="12" fill="#fbc02d"/>
    <circle cx="124" cy="48" r="8" fill="#e65100"/>
    <polygon points="124,32 127,38 121,38" fill="#fbc02d"/>
    <polygon points="138,42 132,44 134,39" fill="#fbc02d"/>
    <polygon points="138,55 132,53 134,58" fill="#fbc02d"/>
    <polygon points="124,64 127,58 121,58" fill="#fbc02d"/>
    <circle cx="124" cy="48" r="3" fill="#ffffff"/>

    <!-- Ship Mast -->
    <line x1="45" y1="50" x2="45" y2="2" stroke="#4e342e" stroke-width="3"/>
    
    <!-- Sail with Straw Hat Skull -->
    <path d="M 20 8 Q 45 16 70 8 L 68 36 Q 45 42 22 36 Z" fill="#fffde7" stroke="#d7ccc8" stroke-width="1"/>
    <!-- Jolly Roger Straw Hat Logo -->
    <circle cx="45" cy="22" r="6" fill="#212121"/>
    <ellipse cx="45" cy="18" rx="9" ry="2.5" fill="#fbc02d"/>
    <circle cx="43" cy="21" r="1" fill="#ffffff"/>
    <circle cx="47" cy="21" r="1" fill="#ffffff"/>

    <!-- CHARACTER 1: MONKEY D. LUFFY (GEAR 5 / STRAW HAT POSE) -->
    <g class="luffy-anim" transform="translate(75, 20)">
      <!-- Gear 5 White Cloud Aura -->
      <ellipse cx="14" cy="18" rx="16" ry="14" fill="#ffffff" opacity="0.4"/>
      <!-- Straw Hat -->
      <ellipse cx="14" cy="8" rx="15" ry="4" fill="#fbc02d" stroke="#e65100" stroke-width="0.8"/>
      <path d="M 6 8 Q 14 -1 22 8 Z" fill="#fbc02d"/>
      <path d="M 6 8 Q 14 5 22 8 Z" fill="#d32f2f"/>
      <!-- Luffy Face with Big Grin -->
      <circle cx="14" cy="14" r="8" fill="#ffcc80"/>
      <!-- Eye Scar Under Left Eye -->
      <line x1="10" y1="15" x2="10" y2="18" stroke="#5d4037" stroke-width="0.8"/>
      <!-- Big Laughing Smile -->
      <path d="M 9 14 Q 14 20 19 14 Z" fill="#d32f2f"/>
      <path d="M 10 14 Q 14 17 18 14 Z" fill="#ffffff"/>
      <!-- Eyes (Happy Arcs) -->
      <path d="M 9 12 Q 11 9 12 12" stroke="#212121" stroke-width="1" fill="none"/>
      <path d="M 16 12 Q 17 9 19 12" stroke="#212121" stroke-width="1" fill="none"/>
      <!-- Red Vest -->
      <path d="M 7 22 L 21 22 L 20 34 L 8 34 Z" fill="#d32f2f"/>
      <line x1="14" y1="22" x2="14" y2="34" stroke="#ffcc80" stroke-width="3"/>
    </g>

    <!-- CHARACTER 2: RORONOA ZORO (SANTORYU THREE SWORDS & GREEN AURA) -->
    <g class="zoro-anim" transform="translate(18, 22)">
      <!-- Green Demon Aura -->
      <ellipse cx="12" cy="18" rx="14" ry="12" fill="#00e676" opacity="0.3"/>
      <!-- Green Hair / Bandanna -->
      <ellipse cx="12" cy="12" rx="7" ry="6" fill="#2e7d32"/>
      <rect x="5" y="11" width="14" height="3" fill="#1b5e20"/>
      <!-- Face -->
      <circle cx="12" cy="16" r="6" fill="#ffcc80"/>
      <!-- Eye Scar -->
      <line x1="9" y1="13" x2="9" y2="18" stroke="#1b5e20" stroke-width="0.8"/>
      <!-- Sword in Mouth (Wado Ichimonji) -->
      <line x1="-4" y1="18" x2="28" y2="18" stroke="#ffffff" stroke-width="1.8"/>
      <line x1="9" y1="18" x2="15" y2="18" stroke="#fbc02d" stroke-width="2.2"/>
      <!-- Green Harami / Coat -->
      <rect x="6" y="22" width="12" height="14" fill="#1b5e20"/>
      <rect x="8" y="25" width="8" height="4" fill="#a5d6a7"/>
      <!-- Two Hand Swords -->
      <line x1="2" y1="14" x2="-8" y2="32" stroke="#00e676" stroke-width="1.5"/>
      <line x1="22" y1="14" x2="32" y2="32" stroke="#00e676" stroke-width="1.5"/>
    </g>
  </g>

  <!-- Rolling Ocean Waves -->
  <g class="wave-anim" transform="translate(0, 260)">
    <path d="M 0 25 Q 117 0 235 25 Q 352 50 470 25 Q 587 0 705 25 Q 822 50 940 25 Q 1057 0 1175 25 Q 1292 50 1410 25 L 1410 80 L 0 80 Z" fill="url(#wave1)"/>
    <path d="M 0 25 Q 117 0 235 25 Q 352 50 470 25 Q 587 0 705 25 Q 822 50 940 25 Q 1057 0 1175 25 Q 1292 50 1410 25" stroke="#e0f2fe" stroke-width="2.5" fill="none" opacity="0.8"/>
  </g>

  <!-- Golden Outer Frame -->
  <rect x="2" y="2" width="936" height="336" rx="15" fill="none" stroke="#fbc02d" stroke-width="1.8" stroke-opacity="0.6"/>
  <rect x="6" y="6" width="928" height="328" rx="12" fill="none" stroke="#ff1744" stroke-width="0.8" stroke-opacity="0.4"/>
</svg>
